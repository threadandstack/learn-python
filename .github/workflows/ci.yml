name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # exercise.py files are stubs that fail until a learner fills them
      # in, so each module's tests run against its reference solution.
      - name: Run module tests against reference solutions
        run: |
          set -euo pipefail
          for module in modules/*/; do
            echo "::group::$module"
            if [ -f "$module/solutions/solution.py" ]; then
              work=$(mktemp -d)
              cp "$module"/test_*.py "$work/"
              cp "$module/solutions/solution.py" "$work/exercise.py"
              (cd "$work" && pytest -p no:cacheprovider)
            else
              (cd "$module" && pytest)
            fi
            echo "::endgroup::"
          done

[pytest]
; This file's presence marks LEARN_PYTHON as pytest's rootdir, so the
; shared conftest.py at this level gets picked up no matter which module
; subfolder you run `pytest` from.
;
; Each module's test file is named test_NN.py (unique per module, see
; modules/*/test_NN.py) rather than a shared name like test_exercise.py —
; that's what lets `from exercise import ...` keep working with pytest's
; default import mode while also making a root-level `pytest` (collecting
; every module's tests in one run) collision-free.
